<!DOCTYPE html>
<html lang="en">
    <head>

        <!-- Loading Inter typeface -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Styling -->
        <!-- Boostrap CDN Link -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootsrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">        
        <!-- My CSS -->
        <link rel="stylesheet" href="styles.css">

        <title>Helix Dashboard</title>

    </head>
    <body>  

        <!-- Elements -->

        <div id="app" class="d-flex"> <!--making a flexbox container which will contain child elements whose alignment, order etc we can control-->
            <!-- Sidebar nav -->
            <div class="custom-sidebar" style="width: 250px;">
                
                <div class="p-3">
                    <h4>Helix</h4>
                </div>

                <ul class="nav flex-column px-2"> <!--flex column to stack vertically-->

                    <li class="nav-item">
                        <a class="nav-link active py-2" href="#">
                            <i class="bi bi-house icon-outline me-2"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-clipboard-data me-2"></i>

                    </li>            
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">

                    </li>

                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-person me-2"></i>

                    </li>    
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-intersect me-2"></i>
                            Compare</a>
                    </li>                    

                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-info-square me-2"></i>

                    </li>                    
                </ul>

            <div class="flex-grow-1 p-4"> <!--padding and spacing-->
