<!DOCTYPE html>
<html lang="en">
    
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">        
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/leaderboards.css">
        <title>Helix Leaderboards</title>
    </head>    
    <body>
        <div id="app" class="d-flex"> 

            <!-- Sidebar nav -->
            <div class="custom-sidebar">
                
                <div class="p-3">
                    <h4>Helix</h4>
                </div>

                <ul class="nav flex-column px-2">

                    <li class="nav-item">
                        <a class="nav-link py-2" href="index.html">
                            <i class="bi bi-house me-2"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active py-2" href="about.html">
                            <i class="bi bi-clipboard-data me-2"></i>
                            Leaderboards</a>
                    </li>            
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="analytics.html">
                            <i class="bi bi-bar-chart me-2"></i>
                            Analytics</a>
                    </li>         
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-person me-2"></i>
                            Find players</a>
                    </li>    
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="compare.html">
                            <i class="bi bi-intersect me-2"></i>
                            Compare</a>
                    </li>                    

                    <li class="nav-item">
                        <a class="nav-link py-2" href="about.html">
                            <i class="bi bi-info-square me-2"></i>
                            About</a>
                    </li>                    
                </ul>

            </div>        
            
            <!-- Main content -->
            <div id="main-content" class="flex-grow-1">

                <div id="leaderboards-container">
                    <!-- Text at the top -->
                    <div id="leaderboards-header">
                        <h2>Leaderboards</h2>
                        <p>Top performers across the 2024 Premier League season.</p>
                    </div>
                    
                    <!-- League selection -->
                    <select id="league-select" class="form-select" style="max-width: 200px;">
                        <option value="ENG.1">Premier League</option>
                        <option value="ESP.1">La Liga</option>
                        <option value="ITA.1">Serie A</option>
                        <option value="GER.1">Bundesliga</option>
                        <option value="FRA.1">Ligue 1</option>
                    </select>   

                    <!-- Buttons to switch between tabs -->
                    <div id="leaderboard-tabs">
                        <button class="tab-btn active" data-tab="scorers">Top Scorers</button>
                        <button class="tab-btn" data-tab="assisters">Top Assisters</button>
                        <button class="tab-btn" data-tab="goalkeepers">Goalkeepers</button>
                    </div>       

                    <div id="table-container">

                    </div>
                        
                </div>       
            </div> 
        </div>

        <script src="../js/ui.js"></script>
        <script src="../js/leaderboards.js"></script>                
    </body>
</html>
