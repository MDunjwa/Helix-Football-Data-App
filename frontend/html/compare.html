<!DOCTYPE html>
<html lang="en">
    
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">        
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/compare.css">
        <title>Helix Analytics</title>
    </head>    
    <body>
        <div id="app" class="d-flex"> 

            <!-- Sidebar nav -->
            <div class="custom-sidebar">
                
                <div class="p-3">
                    <h4>Helix</h4>
                </div>

                <ul class="nav flex-column px-2">

                    <li class="nav-item">
                        <a class="nav-link py-2" href="index.html">
                            <i class="bi bi-house me-2"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link py-2" href="leaderboards.html">
                            <i class="bi bi-clipboard-data me-2"></i>
                            Leaderboards</a>
                    </li>            
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="analytics.html">
                            <i class="bi bi-bar-chart me-2"></i>
                            Analytics</a>
                    </li>         
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-person me-2"></i>
                            Find players</a>
                    </li>    
                    
                    <li class="nav-item">
                        <a class="nav-link active py-2" href="#">
                            <i class="bi bi-intersect me-2"></i>
                            Compare</a>
                    </li>                    

                    <li class="nav-item">
                        <a class="nav-link py-2" href="#">
                            <i class="bi bi-info-square me-2"></i>
                            About</a>
                    </li>                    
                </ul>

            </div>        
            
            <!-- Main content -->
            <div id="main-content" class="flex-grow-1">

                <div id="compare-container">
                    <!-- Text at the top -->
                    <div id="compare-header">
                        <h2>Compare</h2>
                        <p>Compare players</p>
                    </div>

                    <!-- Player profiles -->
                    <div id="player-slots">

                        <div id="profile-1" class="player-slot">
                            <div class="search-box" id="search-box-1">
                                <!-- Search bar -->
                                <input 
                                    type="text" 
                                    class="player-search-input" 
                                    data-slot="1"
                                    placeholder="Search for a player..."
                                />
                                <div class="search-dropdown" id="dropdown-1"></div>                            
                            </div>
                            <!-- Player profile card -->
                            <div class="card-wrapper">
                                <div class="player-card" id="card-1" style="display:none"></div>
                            </div>
                            
                        </div>

                        <div id="profile-2" class="player-slot">
                            <div class="search-box" id="search-box-2">
                                <input 
                                    type="text" 
                                    class="player-search-input" 
                                    data-slot="2"
                                    placeholder="Search for a player..."
                                />
                                <div class="search-dropdown" id="dropdown-2"></div>
                                
                            </div>
                            <div class="card-wrapper">
                                <div class="player-card" id="card-2" style="display:none"></div>
                            </div>
                        </div>

                    </div>

                    <!-- Radar chart and lollipop -->
                     <div id="charts-container">

                        <div id="radar-chart">

                        </div>
                        <div id="lollipop-chart">

                        </div>

                     </div>
                
                                 
                </div>       
            </div> 
        </div>

        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
        <script src="../js/ui.js"></script>
        <script src="../js/compare.js"></script>                
    </body>
</html>
