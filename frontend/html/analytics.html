<!DOCTYPE html>
<html lang="en">
    
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">        
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/analytics.css">
        <title>Helix Analytics</title>
    </head>    
    <body>
        <div id="app" class="d-flex"> 

            <!-- Sidebar nav -->
            <div class="custom-sidebar">
                
                <div class="p-3">
                    <h4>Helix</h4>
                </div>

                <ul class="nav flex-column px-2">

                    <li class="nav-item">
                        <a class="nav-link py-2" href="index.html">
                            <i class="bi bi-house me-2"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link py-2" href="leaderboards.html">
                            <i class="bi bi-clipboard-data me-2"></i>
                            Leaderboards</a>
                    </li>            
                    
                    <li class="nav-item">
                        <a class="nav-link active py-2" href="analytics.html">
                            Analytics</a>
                    </li>            
                    
                    <li class="nav-item">
                        <a class="nav-link py-2" href="compare.html">
                            <i class="bi bi-intersect me-2"></i>
                            Compare</a>
                    </li>                    

                    <li class="nav-item">
                        <a class="nav-link py-2" href="about.html">
                            <i class="bi bi-info-square me-2"></i>
                            About</a>
                    </li>                    
                </ul>

            </div>        
            
            <!-- Main content -->
            <div id="main-content" class="flex-grow-1">

                <div id="analytics-container">
                    <!-- Text at the top -->
                    <div id="analytics-header">
                        <h2>Analytics</h2>
                        <p>Discover patterns in players</p>
                    </div>
                
                    <!-- League dif -->
                    <select id="league-select-dd" class="league-selection">
                        <option value="ENG.1">Premier League</option>
                        <option value="ESP.1">La Liga</option>
                        <option value="GER.1">Bundesliga</option>
                        <option value="ITA.1">Serie A</option>
                        <option value="FRA.1">Ligue 1</option>
                    </select>   
                                     
                    <!-- Buttons to switch between tabs -->
                    <div id="analytics-tabs">
                        <button class="tab-btn active" data-tab="scoring">Scoring</button>
                        <button class="tab-btn" data-tab="creativity">Creativity</button>
                        <button class="tab-btn" data-tab="defense">Defense</button>
                        <button class="tab-btn" data-tab="goalkeeping">Goalkeeping</button>
                    </div>       

                   <!-- Chart selector -->
                    <div id="chart-selector" class="chart-selector"></div>
                    
                    <!-- Main chart -->
                    <div id="main-chart-container">
                        <div id="main-chart-title"></div>
                        <div id="main-chart-description"></div>
                        <div id="main-chart"></div>
                    </div>

                    <!-- Secondary charts -->
                    <div id="secondary-charts">
                        <!-- <div class="secondary-chart" id="secondary-chart-0"></div> -->
                        <!-- <div class="secondary-chart" id="secondary-chart-1"></div> -->
                    </div>                        
                </div>       
            </div> 
        </div>

        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
        <script src="../js/ui.js"></script>
        <script src="../js/analytics.js"></script>                
    </body>
</html>
